name: Package Addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must run from the main branch."
            exit 1
          fi

          toc_version=$(awk -F': ' '/^## Version:/ {print $2; exit}' RXPGuides.toc)
          if [[ -n "${toc_version}" && "${toc_version}" != "@project-version@" ]]; then
            tag="${toc_version}"
          else
            tag=$(gh api repos/RestedXP/RXPGuides/releases/latest --jq '.tag_name')
          fi

          if [[ "${tag}" != v* ]]; then
            tag="v${tag}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not determine a valid release version: ${tag}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "${tag}" --message "Release ${tag}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Package addon
        uses: BigWigsMods/packager@v2
        with:
          args: -d -p 0 -a 0 -w 0

      - name: Replace GitHub release
        run: |
          shopt -s nullglob
          packages=(.release/RXPGuides*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "The packager did not create an RXPGuides ZIP."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --cleanup-tag --yes
          fi
          git push origin "refs/tags/${RELEASE_TAG}" --force
          gh release create "${RELEASE_TAG}" "${packages[@]}" \
            --title "${RELEASE_TAG}" \
            --notes "Personal RXPGuides build based on upstream ${RELEASE_TAG}."
